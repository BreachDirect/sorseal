name: 'sorseal'
description: >-
  Prove that your Soroban/WASM contract artifacts match the sealed provenance
  record, and scan contract source for known-fragile Soroban patterns. Runs
  `sorseal verify` and `sorseal analyze` in CI and can upload results to
  GitHub code scanning as SARIF.
author: BreachDirect
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  working-directory:
    description: >-
      Directory (relative to the repository root) that contains the sorseal
      manifest and sealed provenance. Defaults to the repository root.
    required: false
    default: '.'
  manifest:
    description: >-
      Path to the sorseal.toml manifest, relative to `working-directory`.
    required: false
    default: 'sorseal.toml'
  provenance:
    description: >-
      Path to the sealed sorseal.provenance.json, relative to `working-directory`.
    required: false
    default: 'sorseal.provenance.json'
  mode:
    description: >-
      What to run: `verify` (provenance only — default), `analyze` (scan only),
      or `both` (verify + analyze). In `analyze`/`both` mode, `analyze --fail-on`
      is used as a CI gate when `fail-on` is set.
    required: false
    default: 'verify'
  sarif-file:
    description: >-
      Path to write the SARIF report (relative to `working-directory`). In
      `both` mode the report is split into `<path>.verify.sarif` and
      `<path>.analyze.sarif`; otherwise the exact path is used. When set, the
      action uploads any produced `*.sarif` files to GitHub code scanning
      automatically.
    required: false
    default: ''
  fail-on:
    description: >-
      Severity threshold for `analyze --fail-on`. When set in analyze/both
      mode, the build fails if any finding is at or above this severity.
      Accepted values: Low, Medium, High, Critical (case-insensitive).
    required: false
    default: 'High'
  toolchain:
    description: >-
      Rust toolchain to use for the standalone build. Defaults to stable.
    required: false
    default: 'stable'
  wasm-target:
    description: >-
      Rust WASM target(s) the project builds to (space-separated). Modern
      Soroban (soroban-sdk >= 21 / protocol >= 22) builds to `wasm32v1-none`;
      older contracts use `wasm32-unknown-unknown`.
    required: false
    default: 'wasm32-unknown-unknown'

outputs:
  passed:
    description: >-
      'true' when every provenance/analysis check passed, 'false' otherwise.
    value: ${{ steps.checks.outputs.passed }}

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}

    - name: Add WASM target(s)
      shell: bash
      run: |
        for t in ${{ inputs.wasm-target }}; do
          rustup target add "$t"
        done

    - name: Build sorseal from source
      shell: bash
      run: |
        cargo build --release --locked --manifest-path "${{ github.action_path }}/Cargo.toml"
        mkdir -p "$RUNNER_TOOL_CACHE/sorseal"
        cp "${{ github.action_path }}/target/release/sorseal" "$RUNNER_TOOL_CACHE/sorseal/sorseal"
        echo "$RUNNER_TOOL_CACHE/sorseal" >> "$GITHUB_PATH"

    - name: Run sorseal checks
      id: checks
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        mode="${{ inputs.mode }}"
        sarif="${{ inputs.sarif-file }}"
        passed=true

        run_verify() {
          local args=(--manifest "${{ inputs.manifest }}" --provenance "${{ inputs.provenance }}")
          if [ -n "$sarif" ]; then
            if [ "$mode" = both ]; then
              args+=(--sarif "${sarif}.verify.sarif")
            else
              args+=(--sarif "$sarif")
            fi
          fi
          if ! sorseal verify "${args[@]}"; then
            passed=false
          fi
        }

        run_analyze() {
          local args=()
          if [ -n "$sarif" ]; then
            if [ "$mode" = both ]; then
              args+=(--sarif "${sarif}.analyze.sarif")
            else
              args+=(--sarif "$sarif")
            fi
          fi
          if [ -n "${{ inputs.fail-on }}" ]; then
            args+=(--fail-on "${{ inputs.fail-on }}")
          fi
          # analyze is report-only without --fail-on, so gate explicitly
          if ! sorseal analyze "${args[@]}"; then
            passed=false
          fi
        }

        case "$mode" in
          verify) run_verify ;;
          analyze) run_analyze ;;
          both)
            run_verify
            run_analyze
            ;;
          *) echo "::error::unknown mode '$mode' (expected verify|analyze|both)"; passed=false ;;
        esac

        echo "passed=$passed" >> "$GITHUB_OUTPUT"
        [ "$passed" = true ]

    - name: Upload SARIF to code scanning
      if: inputs.sarif-file != '' && always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ github.workspace }}/${{ inputs.working-directory }}