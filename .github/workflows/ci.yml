name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint with warnings denied
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Add wasm32-unknown-unknown target (fixture e2e)
        run: rustup target add wasm32-unknown-unknown
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build (locked to committed Cargo.lock)
        run: cargo build --locked
      - name: Run test suite (unit + e2e against the echo fixture)
        run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Add wasm32-unknown-unknown target (fixture e2e)
        run: rustup target add wasm32-unknown-unknown
      - name: Build + test on MSRV (locked)
        run: cargo build --locked && cargo test --locked

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Add wasm32-unknown-unknown target (fixture build)
        run: rustup target add wasm32-unknown-unknown
      - name: Build release binary (locked)
        run: cargo build --release --locked
      - name: Smoke — CLI boots, scaffolds, and seals+verifies the fixture
        run: |
          ./target/release/sorseal --version
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          "$GITHUB_WORKSPACE/target/release/sorseal" init --project demo
          test -f sorseal.toml
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/echo/." "$tmpdir/echo"
          cd "$tmpdir/echo"
          "$GITHUB_WORKSPACE/target/release/sorseal" record
          rm -rf target
          "$GITHUB_WORKSPACE/target/release/sorseal" verify
          echo "smoke ok"

  action:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Add wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown
      - name: Build release binary (locked)
        run: cargo build --release --locked
      - name: Seed a sealed fixture the action will verify
        run: |
          mkdir -p dogfood
          cp -r tests/fixtures/echo/. dogfood/
          printf 'target/\nsorseal.provenance.json\nsorseal.sarif\n' > dogfood/.gitignore
          cd dogfood
          git init -q
          git config user.email ci@example.com
          git config user.name "Sorseal CI"
          git add .
          git commit -q -m "seed dogfood fixture"
          "$GITHUB_WORKSPACE/target/release/sorseal" record
          test -f sorseal.provenance.json
          echo "sealed fixture ready"
      - name: Run the sorseal action (dogfood)
        uses: ./
        with:
          working-directory: dogfood
          sarif-file: sorseal.sarif
      - name: Verify SARIF was produced and is valid JSON
        run: |
          python3 -c "import json; d=json.load(open('dogfood/sorseal.sarif')); assert d['version']=='2.1.0'; assert d['runs'][0]['results']==[], 'expected clean verify'; print('sarif ok:', d['runs'][0]['tool']['driver']['name'])"
