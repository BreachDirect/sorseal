name: Feature request
description: Propose a new feature or improvement for sorseal
title: "[feat]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please check the roadmap issues first — your feature may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you solving? Focus on the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should sorseal do, and what would the user experience look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've considered.
  - type: checkboxes
    id: checklist
    attributes:
      label: I have
      options:
        - label: Searched existing issues and roadmap issues for duplicates
          required: true
        - label: Checked whether this is already covered by an open phase issue
          required: true
